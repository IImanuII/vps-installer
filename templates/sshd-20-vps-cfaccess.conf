# vps-installer: accesso SSH dal browser (Cloudflare Access).
# Cloudflare emette certificati SSH di breve durata firmati dalla CA dell'app;
# il terminale nel browser entra con utente e principal = parte dell'email prima
# della @, quindi c'è un utente Linux per ogni email autorizzata.
# authorized_keys non cambia: le chiavi di sempre continuano a funzionare.
# Le righe AllowUsers e Match User sono aggiunte in coda dall'installer
# (st_sshd_conf), con l'elenco degli utenti creati.
TrustedUserCAKeys /etc/ssh/vps-cf-ca.pub
AuthorizedPrincipalsFile /etc/ssh/vps-cf-principals/%u
